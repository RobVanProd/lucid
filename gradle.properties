# Project-wide Gradle settings for LUCID

# JVM memory settings - reduced for constrained environments
org.gradle.jvmargs=-Xmx768m -XX:+UseSerialGC -Dfile.encoding=UTF-8

# Disable daemon to reduce memory
org.gradle.daemon=false

# AndroidX
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Enables namespacing of each library's R class
android.nonTransitiveRClass=true

# Disable parallel builds to reduce memory pressure
org.gradle.parallel=false
org.gradle.caching=true
